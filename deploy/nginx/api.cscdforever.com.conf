server {
  listen 80;
  listen [::]:80;
  server_name api.cscdforever.com;

  # Certbot usará este server block para validar ACME y luego inyectará SSL.
  location / {
    return 301 https://$host$request_uri;
  }
}

# SSL server block (Certbot lo completará o podés pegar los certificados manualmente)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.cscdforever.com;

  # Si usás Certbot, estas líneas se gestionan automáticamente.
  # ssl_certificate /etc/letsencrypt/live/api.cscdforever.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/api.cscdforever.com/privkey.pem;

  client_max_body_size 10m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket (por si en el futuro se usa)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

